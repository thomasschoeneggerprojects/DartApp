<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<meta name="color-scheme" content="dark"/>
<title>DartTA</title>
<link rel="stylesheet" href="css/app.css"/>
<link rel="stylesheet" href="css/intro.css"/>
</head>
<body>
<!-- Intro shown while Blazor boots; Components/Home/Intro.razor (same markup) takes over seamlessly. -->
<div id="intro" class="intro" aria-hidden="true">
  <div class="intro-halo"></div>
  <div class="intro-stage">
    <div class="intro-rider">
      <div class="intro-lines"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <img class="intro-ghost g3" src="img/intro-logo.png" alt=""/><img class="intro-ghost g2" src="img/intro-logo.png" alt=""/><img class="intro-ghost g1" src="img/intro-logo.png" alt=""/>
      <div class="intro-pulse">
        <img src="img/intro-logo.png" alt=""/>
        <svg class="intro-swoosh" viewBox="-118 -118 236 236">
          <defs>
            <linearGradient id="isg" gradientUnits="userSpaceOnUse" x1="50" y1="-87" x2="50" y2="87">
              <stop offset="0" stop-color="#1450d8"/><stop offset=".45" stop-color="#2f8cff"/>
              <stop offset=".8" stop-color="#8fd2ff" stop-opacity=".7"/><stop offset="1" stop-color="#d6f0ff" stop-opacity="0"/>
            </linearGradient>
            <filter id="isglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
            <path id="isc" d="M50 -86.6 A100 100 0 0 1 50 86.6 A135 135 0 0 0 50 -86.6Z"/>
            <g id="isa"><use href="#isc" fill="#3b9bff" opacity=".45" filter="url(#isglow)"/><use href="#isc" fill="url(#isg)"/></g>
          </defs>
          <g class="sp2"><g transform="rotate(90) scale(.86)"><use href="#isa"/><use href="#isa" transform="rotate(180)"/></g></g>
          <g class="sp"><g transform="rotate(-40)"><use href="#isa"/><use href="#isa" transform="rotate(180)"/></g></g>
        </svg>
      </div>
    </div>
    <div class="intro-ring"></div><div class="intro-ring r2"></div>
  </div>
  <div class="intro-text">
    <div class="intro-title">DART<span>TA</span></div>
    <div class="intro-tag">DART SCORING &amp; TRAINING</div>
  </div>
</div>
<div id="app"></div>
<script>
window.dartIntro={t0:performance.now(),elapsed:function(){return performance.now()-this.t0;}};
// Called by Main.razor when the UI language changes (used for hyphenation of long translated words).
window.dartLang=function(l){document.documentElement.lang=l;};
(function(){
  var app=document.getElementById('app');
  var mo=new MutationObserver(function(){
    if(!document.getElementById('intro-live'))return;
    mo.disconnect();
    document.documentElement.style.setProperty('--it',Math.round(window.dartIntro.elapsed())+'ms');
    var s=document.getElementById('intro');if(s)s.remove();
  });
  mo.observe(app,{childList:true,subtree:true});
})();
</script>
<script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
