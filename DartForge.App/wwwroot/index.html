<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<meta name="color-scheme" content="dark"/>
<title>DartTA</title>
<link rel="stylesheet" href="css/app.css"/>
<style>
/* ---------- Intro screen (shown while Blazor boots) ---------- */
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(circle at 50% 45%,#12203a 0%,#0c111b 65%);transition:opacity .55s ease,visibility .55s}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}
.intro-stage{position:relative;width:min(68vw,320px);aspect-ratio:1}
.intro-stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.intro-spin{transform-origin:0 0;animation:intro-in .7s cubic-bezier(.2,.8,.2,1) both,intro-spin 1.6s linear infinite}
.intro-spin2{transform-origin:0 0;animation:intro-spin 2.4s linear infinite reverse;opacity:.35}
.intro-logo{position:absolute;inset:27%;border-radius:50%;background:#fff;padding:5%;box-shadow:0 0 28px #2f8cff66,inset 0 0 0 2px #2f8cff33;display:flex;align-items:center;justify-content:center;animation:intro-logo .6s .45s cubic-bezier(.2,.8,.3,1.3) both}
.intro-logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.intro-word{font:900 26px/1 Inter,Roboto,'Segoe UI',Arial,sans-serif;letter-spacing:4px;color:#58e5b6;animation:intro-word .6s .75s ease-out both}
.intro-word span{color:#fff}
@keyframes intro-spin{to{rotate:360deg}}
@keyframes intro-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes intro-logo{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes intro-word{from{transform:translateY(10px);opacity:0;letter-spacing:12px}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.intro-spin,.intro-spin2{animation:intro-in .4s both}}
</style>
</head>
<body>
<div id="intro" aria-hidden="true">
  <div class="intro-stage">
    <svg viewBox="-118 -118 236 236">
      <defs>
        <!-- Crescent: thick deep-blue head fading into a pale tail -->
        <linearGradient id="ig" gradientUnits="userSpaceOnUse" x1="50" y1="-87" x2="50" y2="87">
          <stop offset="0" stop-color="#1450d8"/>
          <stop offset=".45" stop-color="#2f8cff"/>
          <stop offset=".8" stop-color="#8fd2ff" stop-opacity=".7"/>
          <stop offset="1" stop-color="#d6f0ff" stop-opacity="0"/>
        </linearGradient>
        <filter id="iglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
        <filter id="isoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
        <path id="icres" d="M50 -86.6 A100 100 0 0 1 50 86.6 A135 135 0 0 0 50 -86.6Z"/>
        <g id="iarc">
          <use href="#icres" fill="#3b9bff" opacity=".55" filter="url(#iglow)" transform="scale(1.04)"/>
          <use href="#icres" fill="url(#ig)" filter="url(#isoft)"/>
          <use href="#icres" fill="url(#ig)"/>
        </g>
      </defs>
      <g class="intro-spin2"><g transform="rotate(90) scale(.78)"><use href="#iarc"/><use href="#iarc" transform="rotate(180)"/></g></g>
      <g class="intro-spin"><g transform="rotate(-40)"><use href="#iarc"/><use href="#iarc" transform="rotate(180)"/></g></g>
    </svg>
    <div class="intro-logo"><img src="img/logo.png" alt=""/></div>
  </div>
  <div class="intro-word"><span>DART</span>TA</div>
</div>
<div id="app"></div>
<script>
// Hide the intro once Blazor has rendered something AND a minimum show time has passed (max 8 s as a fallback).
(function(){
  var intro=document.getElementById('intro'),app=document.getElementById('app'),t0=Date.now(),MIN=2200,MAX=8000,closed=false;
  function close(){if(closed)return;closed=true;intro.classList.add('done');setTimeout(function(){intro.remove();},700);}
  function ready(){var wait=Math.max(0,MIN-(Date.now()-t0));setTimeout(close,wait);}
  if(app.firstElementChild){ready();}
  else{var mo=new MutationObserver(function(){if(app.firstElementChild){mo.disconnect();ready();}});mo.observe(app,{childList:true});}
  setTimeout(close,MAX);
})();
</script>
<script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
